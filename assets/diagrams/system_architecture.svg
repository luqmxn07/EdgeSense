<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" fill="none">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151F30"/>
      <stop offset="100%" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="960" height="300" fill="#080D18" rx="12"/>

  <!-- Block 1: Monitored DC Motor -->
  <g filter="url(#shadow)">
    <rect x="40" y="50" width="150" height="190" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="2"/>
    <circle cx="115" cy="110" r="32" fill="#0E1624" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="115" cy="110" r="12" fill="#3B82F6"/>
    <text x="115" y="170" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="14" text-anchor="middle">DC Motor</text>
    <text x="115" y="190" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Monitored Asset</text>
    <text x="115" y="210" fill="#64748B" font-family="monospace" font-size="10" text-anchor="middle">MOTOR_01</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 200 145 L 245 145" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="245,140 255,145 245,150" fill="#3B82F6"/>

  <!-- Block 2: Transducers -->
  <g filter="url(#shadow)">
    <rect x="260" y="50" width="170" height="190" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="2"/>
    <rect x="280" y="80" width="130" height="50" rx="6" fill="#0E1624" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="345" y="102" fill="#22D3EE" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" text-anchor="middle">MPU6050</text>
    <text x="345" y="118" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">3-Axis Vibration (I2C)</text>

    <rect x="280" y="145" width="130" height="50" rx="6" fill="#0E1624" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="345" y="167" fill="#F59E0B" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" text-anchor="middle">DS18B20</text>
    <text x="345" y="183" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Casing Temp (1-Wire)</text>
    <text x="345" y="222" fill="#64748B" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Physical Transducers</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 440 145 L 485 145" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="485,140 495,145 485,150" fill="#22D3EE"/>

  <!-- Block 3: ESP32 Edge Compute -->
  <g filter="url(#shadow)">
    <rect x="500" y="40" width="190" height="210" rx="8" fill="url(#cardGrad)" stroke="#22D3EE" stroke-width="2"/>
    <rect x="520" y="65" width="150" height="40" rx="4" fill="#0E1624" stroke="#3B82F6" stroke-width="1"/>
    <text x="595" y="85" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13" text-anchor="middle">ESP32 DevKit V1</text>
    <text x="595" y="98" fill="#3B82F6" font-family="monospace" font-size="9" text-anchor="middle">240MHz Xtensa LX6</text>

    <text x="595" y="130" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">RMS Energy Filter</text>
    <text x="595" y="150" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">3-Sigma Z-Score Engine</text>
    <text x="595" y="170" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Wi-Fi HTTP REST Server</text>
    
    <rect x="525" y="195" width="140" height="26" rx="4" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
    <text x="595" y="212" fill="#10B981" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="10" text-anchor="middle">Edge Intelligence</text>
  </g>

  <!-- Arrow 3 (Wi-Fi) -->
  <g>
    <path d="M 700 145 L 745 145" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="745,140 755,145 745,150" fill="#F59E0B"/>
    <text x="725" y="132" fill="#F59E0B" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Wi-Fi</text>
  </g>

  <!-- Block 4: EdgeSense Dashboard -->
  <g filter="url(#shadow)">
    <rect x="760" y="50" width="160" height="190" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="2"/>
    <rect x="780" y="80" width="120" height="60" rx="4" fill="#0E1624" stroke="#3B82F6" stroke-width="1"/>
    <path d="M 790 120 Q 805 95, 820 115 T 850 110 T 880 120" stroke="#22D3EE" stroke-width="2" fill="none"/>
    <text x="840" y="165" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13" text-anchor="middle">EdgeSense</text>
    <text x="840" y="182" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">SCADA Dashboard</text>
    <text x="840" y="200" fill="#64748B" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">HTML5 / CSS / Chart.js</text>
  </g>
</svg>
