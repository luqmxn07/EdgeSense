services:
  - type: web
    name: edgesense-backend
    env: python
    region: oregon # or frankfurt, ohio, singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: "*"
