<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad-blue-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Shield / Hexagonal Industrial Geometry -->
  <polygon points="50,6 90,28 90,72 50,94 10,72 10,28" 
           stroke="url(#grad-blue-cyan)" stroke-width="4" fill="#101827" fill-opacity="0.9" />
  
  <!-- Inner Ring / Motor Stator Representation -->
  <circle cx="50" cy="50" r="28" stroke="#1E293B" stroke-width="4" stroke-dasharray="4 3" />
  
  <!-- Center Rotor Core -->
  <circle cx="50" cy="50" r="14" fill="#151F30" stroke="#3B82F6" stroke-width="2.5" />
  
  <!-- Vibration Waveform traversing through the center -->
  <path d="M 22 50 Q 32 32, 40 50 T 50 50 T 60 50 T 68 28 T 78 50" 
        stroke="#22D3EE" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
        
  <!-- Sensory Node Beacon -->
  <circle cx="50" cy="50" r="4" fill="#10B981" />
  <circle cx="50" cy="50" r="8" stroke="#10B981" stroke-width="1.5" opacity="0.6">
    <animate attributeName="r" values="4;12;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
